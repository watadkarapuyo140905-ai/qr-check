<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ていしゅつチェック</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f7f7f7;
    }

    h1 {
      font-size: 28px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
    }

    #result {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border-radius: 12px;
      font-size: 22px;
      font-weight: bold;
    }

  </style>

</head>


<body>

<h1>ていしゅつチェック</h1>

<div id="reader"></div>

<div id="result">
  QRコードをうつしてください
</div>


<script>

const scanner = new Html5Qrcode("reader");

let processing = false;


/* Apps Script */

const appsScriptUrl =
  "https://script.google.com/macros/s/AKfycbyD_PVjnzVW28vNbduCNUgZJclL4OV1WqaspoFZpnLAQDtAc9QyPtyF3pz5k4o-xLg/exec";


/* 「ピッ！」という音を作る */

let audioContext = null;

function beep() {

  try {

    if (!audioContext) {
      audioContext =
        new (window.AudioContext ||
             window.webkitAudioContext)();
    }

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type = "sine";

    oscillator.frequency.value = 1200;

    gain.gain.value = 0.15;

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + 0.08
    );

  } catch (error) {

    console.log("音を鳴らせませんでした:", error);

  }

}


/* カメラを起動 */

async function startCamera() {

  try {

    const cameras = await Html5Qrcode.getCameras();

    if (!cameras || cameras.length === 0) {
      throw new Error("カメラが見つかりません");
    }


    /* 背面カメラを探す */

    let backCamera = cameras.find(camera =>
      /back|rear|environment|背面|後ろ/i.test(camera.label)
    );


    /* 見つからない場合は最後のカメラ */

    if (!backCamera) {
      backCamera = cameras[cameras.length - 1];
    }


    await scanner.start(

      backCamera.id,

      {
        fps: 15,

        qrbox: {
          width: 250,
          height: 250
        }

      },


      /* QR読み取り成功 */

      function(decodedText) {

        if (processing) {
          return;
        }

        processing = true;


        /* QRを読み取った瞬間に「ピッ！」 */

        beep();


        /*
         * 毎回ここを表示し直す
         */

        document.getElementById("result").innerHTML =
          "✅ ていしゅつしました！<br><br>" +
          "つぎのQRをどうぞ";


        /*
         * Apps Scriptへ送信
         *
         * 結果を待たずに次へ進む
         */

        const sendUrl =
          appsScriptUrl +
          "?code=" +
          encodeURIComponent(decodedText) +
          "&t=" +
          Date.now();


        fetch(sendUrl, {
          method: "GET",
          mode: "no-cors",
          cache: "no-store"
        }).catch(function(error) {

          console.log("送信エラー:", error);

        });


        /*
         * 同じQRを連続で読み取らないための
         * 最小限の待ち時間
         */

        setTimeout(function() {

          processing = false;

        }, 500);

      },


      /* QR読み取り失敗は無視 */

      function(errorMessage) {

      }

    );


    document.getElementById("result").innerHTML =
      "📷 カメラ起動中<br><br>" +
      "QRコードをうつしてください";


  } catch (error) {

    document.getElementById("result").innerHTML =
      "⚠️ カメラを起動できませんでした<br><br>" +
      error;

  }

}


startCamera();

</script>

</body>

</html>
